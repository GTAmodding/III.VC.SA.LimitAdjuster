; ### What the limits are
;
; Pools (PtrNode*, EntryInfoNode, Peds, Vehicles, Buildings, Objects, Dummys, ColModel, Task, Event, ...)
;   How many of each thing can exist at once. Buildings and Dummys in SA stop at 32767 (the game stores their
;   indices in 16 bits). Peds and vehicles don't make the game spawn more; they let it create more when asked.
;   SA: Peds and PedIntelligence are one count (the smaller number applies to both; 0 on either keeps both native).
;   Replays: while the ped or vehicle pool is larger than the game's own, replays are off (their records can't hold
;   the larger indices).
;
; VisibleEntityPtrs, VisibleLodPtrs, InvisibleEntityPtrs, LodRenderList
;   Entities the renderer lists every frame. A long draw distance runs these out first.
;   With an older skygfx: III/VC VisibleEntityPtrs and SA PointLights keep the game's own list, which it reads.
;
; Alpha lists, SortedVehiclesAndPeds, WeaponPedsForPC
;   Entities drawn sorted or faded every frame. When full, the game drew them unsorted or not at all.
;
; StreamingObjectInstancesList (SA)
;   Map objects with a loaded model. When full, the game unloaded models it still needed, so they popped in again.
;
; MatrixList (SA)
;   Position matrices of physical objects.
;
; AtomicModels, DamageAtomicModels, TimeModels, WeaponModels, ClumpModels, VehicleModels, PedModels, 2dEffects
;   IDE definitions of each kind (objs, tobj, weap, hier/anim, cars, peds, 2dfx). Still limited by the game's
;   number of model ids.
;
; EntitiesPerIpl, EntityIpl (SA)
;   Instances in one IPL file, and IPL files with instances.
;
; TxdStore (III, VC)
;   Texture dictionaries. III grows up to 4096; VC up to 20000 (collision and animation slots move with it).
;   San Andreas keeps the game's number.
;
; ImgArchives
;   IMG archives the game can open (gta3.dat/gta.dat IMG lines plus the game's own). Room for 128.
;   With Mod Loader installed the game's own count stays: Mod Loader handles IMG files itself.
;
; ObjectData
;   Physics definitions from object.dat (mass, collision response, breakability). Up to 32767; a file the game can't
;   read is left to the game's own handling.
;
; ExtraObjectsDir
;   Models in IMG archives that have no IDE definition.
;
; CutsceneDir
;   Entries of anim\cuts.dir.
;
; WaterQuads, WaterTris, WaterVertices (SA)
;   Water planes from water.dat for custom maps; vertices follow the planes (4 per quad, 3 per triangle).
;
; CollisionSize
;   The largest single collision model in a .col file, in KB.
;
; Coronas, StaticShadows, PolyBunches, ShadowsStored, PointLights, BrightLights, ShinyTexts
;   Light glows, shadows under lamps and traffic lights (and the polygons they use), shadows of cars and peds,
;   lights that light up objects, traffic light and car light glows, reflective signs.
;
; Particles (III, VC), FxParticles (SA)
;   Smoke, sparks, splashes and other particles. SA's number is fixed at startup.
;
; OutsideWorldWaterBlocks
;   unlimited: draw the sea as far as the current view reaches, including view-distance mods.
;   A number fixes the count: III/VC lines of 256-unit blocks (at least 5); SA blocks (at least 70).
;   0 keeps the game's own water limits. Storage grows only when a larger view needs it.
;
; MAINsegmentSize, MissionSize (SA, bytes)
;   unlimited: size from the selected main.scm header and script.img, at least 1 MiB MAIN / 256 KiB mission.
;   A number fixes the size (rounded to 4 bytes). 0 retains the game's 200000 / 69000 bytes.
;   III and VC: CLEO for III/VC already enlarges script space, so the adjuster leaves it to CLEO.
;   Vanilla-size scripts retain the vanilla save layout. Larger scripts require the same scripts when loading saves.
;
; ScriptSearchLights (SA)
;   Searchlights created by scripts (opcode 06B1). unlimited grows when full, up to the 65535-slot handle range.
;   A number fixes the pool size; 0 keeps the game's own eight slots.
;
; HandlingEntries
;   Lines in handling.cfg. A line with a new vehicle name gets a new entry. At most 256 (the game stores the number
;   in a byte).
;
; VehicleAudioSettings (SA)
;   Engine sound, horn, doors and radio of each vehicle model. Vehicles added with new model ids get the first
;   vehicle's entry, or their own from data\gtasa_vehicleAudioSettings.cfg (one line per vehicle: IDE name and the 14
;   values of the entry).
;
; ProcObjects, PlantTriangles, PlantCollisionEntries (SA)
;   Procedural objects (rocks, bushes, litter) and the grass placed on surfaces: tracking entries (512), surface
;   triangles (256) and cached collision entries (40). unlimited gives room for 16384, 8192 and 2048; a number sets
;   the total (up to 65535). Also fixes batches of 256 objects being taken for a failed placement.
;
; MemoryAvailable
;   Streaming memory for models and textures: auto, a number of MB, or a percentage of the RAM (e.g. 25%).
;   auto picks 256 MB (III/VC) or 384 MB (SA), and twice that when the exe can use 4 GB (large address aware).
