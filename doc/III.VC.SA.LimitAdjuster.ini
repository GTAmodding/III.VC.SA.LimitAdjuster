; Open Limit Adjuster
;
; Every limit is unlimited by default: it grows when the game needs more, and costs nothing until then.
; You don't have to change anything here. A line only matters to cap a limit:
;   Key = unlimited   grows on demand (the default)
;   Key = 5000        at most 5000 (or exactly 5000 for a fixed limit)
;   Key = 0           the game's own limit, not touched
; A line that's missing uses the default. A limit another mod already changed is left to that mod
; (see III.VC.SA.LimitAdjuster.log).

